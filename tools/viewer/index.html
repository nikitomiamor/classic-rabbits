<!doctype html>
<html><head><meta charset="utf-8"><title>Rabbit viewer</title>
<style>
  html,body{margin:0;height:100%;background:#9cc3e6;font:13px sans-serif}
  #ui{position:fixed;top:6px;left:6px;background:#fffd;padding:6px 8px;border-radius:6px}
  #ui label{margin-right:8px}
</style></head>
<body>
<div id="ui">
  anim <select id="anim"><option>NONE</option><option>HOP</option><option>IDLE_HEAD_TILT</option><option>BABY_HOP</option><option>BABY_IDLE_HEAD_TILT</option></select>
  t <input id="t" type="range" min="0" max="1" step="0.001" value="0" style="width:220px"> <span id="tv">0</span>s
  <label><input id="play" type="checkbox"> play</label>
  <label><input id="adapt" type="checkbox" checked> adaptar</label>
  view <select id="view"><option>side</option><option>front</option><option>persp</option><option>cC</option><option>cV</option><option>pC</option><option>pV</option><option>fC</option><option>fV</option><option>cBC</option><option>cBV</option><option>pBC</option><option>pBV</option><option>fBC</option><option>fBV</option></select>
</div>
<script src="data.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const D = window.DATA;
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
function fit(){ const w = innerWidth || 800, h = innerHeight || 600; renderer.setSize(w, h); if (typeof cam !== 'undefined'){ cam.aspect = w/h; cam.updateProjectionMatrix(); } }
renderer.setSize(innerWidth || 800, innerHeight || 600); document.body.appendChild(renderer.domElement);
addEventListener('resize', fit);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9cc3e6);
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const dl = new THREE.DirectionalLight(0xffffff, 0.9); dl.position.set(-20, 40, -30); scene.add(dl);
// suelo
const grid = new THREE.GridHelper(64, 64, 0x555555, 0x88aa88); scene.add(grid);
const cam = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.1, 1000);

const COLORS = {torso:0x9b6b43, body:0x9b6b43, head:0xb98a5a, tail:0xeeeeee, left_ear:0xd9a0a0, right_ear:0xd9a0a0,
  right_front_leg:0x7a5434, left_front_leg:0x8a6444, right_hind_leg:0x6b4a2e, left_hind_leg:0x7b5a3e,
  right_haunch:0x553a22, left_haunch:0x654a32};

// ModelPart -> Group. Coordenadas de Minecraft (y abajo); el contenedor invierte x/y como el renderer.
function build(spec, parts){
  const g = new THREE.Group(); g.name = spec.name;
  g.userData.rest = {pos: spec.pivot.slice(), rot: spec.rot.slice()};
  for (const c of spec.cubes){
    const [u,v,x,y,z,w,h,d] = c;
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
      new THREE.MeshLambertMaterial({color: COLORS[spec.name] ?? 0xaaaaaa}));
    m.position.set(x+w/2, y+h/2, z+d/2);
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({color:0x222222}));
    m.add(e); g.add(m);
  }
  parts[spec.name] = g;
  for (const ch of spec.children) g.add(build(ch, parts));
  return g;
}
function makeEntity(spec, scale, xOffset, xPos=0){
  const parts = {};
  const root = build(spec, parts);
  const ent = new THREE.Group();           // world: suelo en y=0
  const flip = new THREE.Group(); flip.scale.set(-1,-1,1); flip.position.y = 24.016;  // render: scale(-1,-1,1) + translate(0,-1.501,0)
  const scaler = new THREE.Group();        // MeshTransformer.scaling(f): translated(0, 24.016*(1-f)) y escala f
  scaler.position.y = 24.016*(1-scale); scaler.scale.setScalar(scale);
  flip.add(scaler); scaler.add(root); ent.add(flip); ent.position.z = xOffset; ent.position.x = xPos; scene.add(ent);
  return parts;
}
const V = makeEntity(D.vanilla, 1.0, 16);
const C = makeEntity(D.classic, D.classicScale, -14);
// bebes: mas atras en x para no mezclarse con los adultos
const BX = -60;
const BV = D.babyVanilla ? makeEntity(D.babyVanilla, 1.0, 16, BX) : {};
const BC = D.babyClassic ? makeEntity(D.babyClassic, 1.0, -14, BX) : {};
function poseAll(anim, t){
  resetPose(V); resetPose(C); resetPose(BV); resetPose(BC);
  if (anim === 'NONE') return;
  if (anim.startsWith('BABY_')){ applyAnim(BV, anim, t, false); applyAnim(BC, anim, t, true); }
  else { applyAnim(V, anim, t, false); applyAnim(C, anim, t, true); }
}

function resetPose(parts){ for (const k in parts){ const p=parts[k], r=p.userData.rest; p.position.set(...r.pos); p.rotation.set(r.rot[0],r.rot[1],r.rot[2],'ZYX'); } }
function catmull(a,p0,p1,p2,p3){ return 0.5*((2*p1)+(-p0+p2)*a+(2*p0-5*p1+4*p2-p3)*a*a+(-p0+3*p1-3*p2+p3)*a*a*a); }
function sample(kf, t){
  let prev = 0; while (prev+1 < kf.length && !(t <= kf[prev+1].t)) prev++;   // igual que binarySearch(...)-1
  // binarySearch devuelve el primer i con t<=kf[i].t; prev = ese-1 (min 0)
  let first = kf.findIndex(k => t <= k.t); if (first < 0) first = kf.length;
  prev = Math.max(0, first-1);
  const next = Math.min(kf.length-1, prev+1);
  const a = next!==prev ? Math.min(1,Math.max(0,(t-kf[prev].t)/(kf[next].t-kf[prev].t))) : 0;
  const it = kf[next].i;
  if (it === 'CATMULLROM'){
    const i0=Math.max(0,prev-1), i3=Math.min(kf.length-1,next+1);
    return [0,1,2].map(j=>catmull(a,kf[i0].v[j],kf[prev].v[j],kf[next].v[j],kf[i3].v[j]));
  }
  return [0,1,2].map(j=>kf[prev].v[j]+(kf[next].v[j]-kf[prev].v[j])*a);
}
function targets(anim, bone, target){
  if (document.getElementById('adapt').checked)
    for (const [a,b,t,list] of D.adapt) if (a===anim && b===bone && t===target) return list;
  return [[bone, 1]];
}
function applyAnim(parts, name, t, adapt){
  const A = D.anims[name]; if (!A) return;
  const tt = A.looping ? t % A.length : t;
  for (const bone in A.bones){
    for (const ch of A.bones[bone]){
      for (const [dst, f] of (adapt ? targets(name, bone, ch.target) : [[bone, 1]])){
        const p = parts[dst]; if (!p) continue;
        const v = sample(ch.kf, tt).map(x=>x*f);
        if (ch.target==='ROTATION'){ p.rotation.set(p.rotation.x+v[0], p.rotation.y+v[1], p.rotation.z+v[2], 'ZYX'); }
        else { p.position.x+=v[0]; p.position.y+=v[1]; p.position.z+=v[2]; }
      }
    }
  }
}
const ui = id=>document.getElementById(id);
function setView(){
  const v = ui('view').value;
  if (v==='side'){ cam.position.set(0, 10, -110); }       // desde el costado (x negativo mira al conejo de lado)
  if (v==='front'){ cam.position.set(0, 10, -110); }
  if (v==='persp'){ cam.position.set(-70, 45, -70); }
  if (v==='side'){ cam.position.set(-110, 8, 0); }
  if (v==='side'){ cam.lookAt(0, 6, 0); return; }
  if (v==='persp'){ cam.lookAt(0, 6, 0); return; }
  // vistas cercanas: cC/cV = clasico/vanilla de costado, pC/pV = en perspectiva
  const baby = v.length === 3, x0 = baby ? BX : 0;
  const z = v.endsWith('C') ? -14 : 16, k = baby ? 0.75 : (v.endsWith('C') ? 0.6 : 1);
  if (v.startsWith('c')) cam.position.set(x0-55*k, 5*k, z);
  if (v.startsWith('p')) cam.position.set(x0-38*k, 26*k, z-38*k);
  if (v.startsWith('f')) cam.position.set(x0, 6*k, z-55*k);
  cam.lookAt(x0, 6*k, z);
}
let t0 = performance.now();
function frame(){
  const anim = ui('anim').value;
  const len = D.anims[anim]?.length ?? 1;
  ui('t').max = len;
  let t = parseFloat(ui('t').value);
  if (ui('play').checked){ t = ((performance.now()-t0)/1000) % len; ui('t').value = t; }
  ui('tv').textContent = t.toFixed(3);
  poseAll(anim, t);
  setView(); renderer.render(scene, cam); requestAnimationFrame(frame);
}
window.setState = (anim, t, view) => { ui('anim').value=anim; ui('t').max=D.anims[anim]?.length??1; ui('t').value=t; if(view) ui('view').value=view; ui('play').checked=false; renderOnce(); };
function renderOnce(){
  if (!renderer.domElement.width || !renderer.domElement.height) fit();
  const anim = ui('anim').value, t = parseFloat(ui('t').value);
  ui('tv').textContent = t.toFixed(3);
  poseAll(anim, t);
  setView(); renderer.render(scene, cam);
}
window.renderOnce = renderOnce;
// hoja de cuadros: sheet('IDLE_HEAD_TILT', [0.5, 1, 1.5], 'pC')
window.sheet = (anim, times, view, cols=4, crop=0.6) => {
  const src = renderer.domElement; let ov = document.getElementById('ov'); if (ov) ov.remove();
  ov = document.createElement('canvas'); ov.id = 'ov';
  const w = 200, h = 150, rows = Math.ceil(times.length/cols);
  ov.width = w*cols; ov.height = h*rows; ov.style = 'position:fixed;left:0;top:40px;z-index:9;background:#000';
  const g = ov.getContext('2d'); g.font = '12px sans-serif';
  times.forEach((t,i) => { window.setState(anim, t, view); const x=(i%cols)*w, y=Math.floor(i/cols)*h;
    const sw=src.width, sh=src.height, cw=sw*crop, ch=cw*0.75;
    g.drawImage(src, (sw-cw)/2, Math.max(0,(sh-ch)/2-sh*0.1), cw, ch, x, y, w, h);
    g.fillStyle='#000'; g.fillText(anim+' '+t, x+4, y+14); });
  document.body.appendChild(ov); return 'ok';
};
window.D2 = D;
frame();
</script>
</body></html>
